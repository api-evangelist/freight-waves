aid: freight-waves
name: Freight Waves
description: >-
  FreightWaves is a supply-chain, logistics, and transportation news and market-
  intelligence company based in Chattanooga, TN, and backed by 8vc. Its SONAR
  platform delivers freight-market data — rate indexes, tender volumes and
  rejection indexes, capacity and pricing signals — by market, lane, and national
  geography over a REST API at api.freightwaves.com. Access uses a bearer token
  obtained from the Credential authenticate endpoint (valid one year); data calls
  are billable while lookup calls (indexes, qualifiers, levels, lanes, zip3,
  latest) are free, and a global 100 requests/minute rate limit applies.
  FreightWaves also operates a hosted, OAuth-protected MCP server
  (api.freightwaves.com/mcp, scope mcp:read) exposing SONAR data to agents.
